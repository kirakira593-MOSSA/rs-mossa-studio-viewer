<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スタジオプログラム一覧（MOSSA）</title>

  <!-- AG Grid CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css" />



<!-- AG Grid JS（Standalone モード・new agGrid.Grid が使える） -->
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.noModules.min.js"></script>



  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f5f5f5;
    }

    header {
      padding: 10px 20px;
      background: #333;
      color: white;
      font-size: 20px;
    }

    #gridContainer {
      height: 85vh;
      width: 100%;
      margin: 10px auto;
    }

    .filter-bar {
      padding: 10px 20px;
      background: #fff;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #ccc;
    }

    .filter-bar select {
      padding: 5px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>スタジオプログラム一覧（MOSSA）</header>

  <!-- フィルタバー -->
  <div class="filter-bar">
    <select id="filterArea">
      <option value="">エリア（全て）</option>
      <option value="北海道・東北">北海道・東北</option>
      <option value="関東">関東</option>
      <option value="東京">東京</option>
      <option value="中部・北陸">中部・北陸</option>
      <option value="近畿">近畿</option>
      <option value="中国・四国">中国・四国</option>
      <option value="九州・沖縄">九州・沖縄</option>
    </select>

    <select id="filterStore">
      <option value="">店舗（全て）</option>
    </select>

    <select id="filterProgram">
      <option value="">プログラム（全て）</option>
    </select>

    <select id="filterInstructor">
      <option value="">インストラクター（全て）</option>
    </select>

    <select id="filterVideo">
      <option value="">映像/通常</option>
      <option value="true">映像</option>
      <option value="false">通常</option>
    </select>

    <select id="filterAvailable">
      <option value="">空き状況（全て）</option>
      <option value="true">空きあり</option>
      <option value="false">満員</option>
    </select>
  </div>

  <!-- AG Grid -->
  <div id="gridContainer" class="ag-theme-alpine"></div>

  <!-- app.js（必ず AG Grid JS の後） -->
  <script src="app.js"></script>
</body>
</html>
